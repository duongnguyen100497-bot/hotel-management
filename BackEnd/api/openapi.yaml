openapi: 3.1.0
info:
  title: Hotel Management Backend API
  version: 0.1.0
  description: Single-hotel management system REST API (modular monolith).
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      tags:
        - System
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      tags:
        - System
      responses:
        "200":
          description: All backing dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /api/v1/auth/register:
    post:
      summary: Register a new customer account
      operationId: registerCustomer
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Customer registered and authenticated session opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: Authenticate with email and Argon2id password
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated successfully (sets rotating refresh cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token cookie and mint new access token
      operationId: refreshAuthSession
      tags:
        - Auth
      responses:
        "200":
          description: Rotated refresh cookie and minted access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid, expired, or replayed refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/logout:
    post:
      summary: Revoke current or all active sessions and clear refresh cookie
      operationId: logoutUser
      tags:
        - Auth
      security:
        - BearerAuth: []
      parameters:
        - name: all
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "204":
          description: Session revoked
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/password-reset-requests:
    post:
      summary: Request a single-use password reset link via email
      operationId: requestPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "202":
          description: Request accepted (uniform response whether or not email exists)
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/password-reset-confirm:
    post:
      summary: Confirm password reset with single-use token and revoke prior sessions
      operationId: confirmPasswordReset
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset confirmed and all sessions revoked
        "401":
          description: Invalid, expired, or already-used reset token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/activate:
    post:
      summary: Activate pending staff user account using single-use email token and set initial password
      operationId: activateStaffAccount
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Account activated and session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid, expired, or already-used activation token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/admin/employees:
    get:
      summary: List employees with account status and assigned roles
      operationId: listEmployees
      tags:
        - People
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Employee list
    post:
      summary: Create employee profile, pending staff user, and enqueue SMTP activation link
      operationId: createEmployee
      tags:
        - People
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Employee created in pending_activation status
        "409":
          description: Duplicate employee code or email

  /api/v1/admin/employees/{id}:
    get:
      summary: Get employee details
      operationId: getEmployee
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Employee details
    patch:
      summary: Update employee profile with optimistic locking (version)
      operationId: updateEmployee
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Employee updated
        "409":
          description: Version conflict

  /api/v1/admin/employees/{id}/resend-activation:
    post:
      summary: Invalidate old activation tokens and resend SMTP activation link
      operationId: resendEmployeeActivation
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: New activation email queued
        "409":
          description: Account is already active or disabled

  /api/v1/admin/employees/{id}/deactivate:
    post:
      summary: Deactivate employee, disable user account, and revoke all active sessions
      operationId: deactivateEmployee
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Employee deactivated
        "409":
          description: Cannot deactivate last active root admin

  /api/v1/customers:
    get:
      summary: List customers with search and cursor pagination (masks governmentId)
      operationId: listCustomers
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
        - name: cursor
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated customer list
    post:
      summary: Create a walk-in customer profile (user_id = NULL)
      operationId: createWalkInCustomer
      tags:
        - People
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Walk-in customer created

  /api/v1/customers/{id}:
    get:
      summary: Get customer profile by ID
      operationId: getCustomer
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Customer details
    patch:
      summary: Update customer profile with optimistic locking (version)
      operationId: updateCustomer
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Customer updated
        "409":
          description: Version or duplicate governmentId conflict

  /api/v1/customers/{id}/archive:
    post:
      summary: Soft-archive a customer profile
      operationId: archiveCustomer
      tags:
        - People
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Customer archived

  /api/v1/me:
    get:
      summary: Get authenticated caller's own user and customer/employee profile
      operationId: getMe
      tags:
        - SelfService
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Self-service profile
    patch:
      summary: Update authenticated caller's own profile (login email is immutable)
      operationId: updateMe
      tags:
        - SelfService
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Updated self-service profile

  /api/v1/me/password:
    post:
      summary: Verify current password, update Argon2id hash, and revoke other sessions
      operationId: changeOwnPassword
      tags:
        - SelfService
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Password changed

  /api/v1/me/sessions:
    get:
      summary: List caller's own active login sessions
      operationId: listOwnSessions
      tags:
        - SelfService
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active sessions list

  /api/v1/me/sessions/{id}:
    delete:
      summary: Revoke one of the caller's own sessions
      operationId: revokeOwnSession
      tags:
        - SelfService
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Session revoked
        "404":
          description: Session not found or owned by another user

  /api/v1/permissions:
    get:
      summary: List all active permissions
      operationId: listPermissions
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active permission registry
        "401":
          description: Unauthenticated
        "403":
          description: Forbidden
    post:
      summary: Create a custom permission code (code is immutable after creation)
      operationId: createPermission
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Permission created
        "403":
          description: Forbidden
        "409":
          description: Duplicate permission code

  /api/v1/permissions/{id}:
    patch:
      summary: Update permission display name and description
      operationId: updatePermission
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Permission updated
        "403":
          description: Forbidden

  /api/v1/roles:
    get:
      summary: List active roles and their assigned permissions
      operationId: listRoles
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Roles list
    post:
      summary: Create a custom non-system role
      operationId: createRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        "201":
          description: Role created
        "403":
          description: Forbidden
        "409":
          description: Duplicate role code

  /api/v1/roles/{id}:
    patch:
      summary: Update role display name and description
      operationId: updateRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role updated
    delete:
      summary: Archive a custom role when no users are assigned
      operationId: deleteRole
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Role archived
        "409":
          description: Role is system/root or still has assigned users

  /api/v1/roles/{id}/permissions:
    put:
      summary: Replace a role's permission bindings (enforces grantable-set and bumps authorization_version)
      operationId: setRolePermissions
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Role permissions updated
        "403":
          description: Privilege escalation denied
        "409":
          description: Root role permissions are immutable

  /api/v1/users:
    get:
      summary: List users and their assigned roles
      operationId: listUsers
      tags:
        - RBAC
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Users with roles

  /api/v1/users/{id}/roles:
    put:
      summary: Replace a staff/admin user's assigned roles (protects last root admin and bumps authorization_version)
      operationId: setUserRoles
      tags:
        - RBAC
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User roles updated
        "403":
          description: Privilege escalation denied
        "409":
          description: Cannot remove root role from last active root admin

  /api/v1/hotel/settings:
    get:
      summary: Get single-hotel settings (public display fields unauthenticated; full settings with version for hotel_settings.read)
      operationId: getHotelSettings
      tags:
        - Property
      responses:
        "200":
          description: Hotel settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/HotelSettings"
    put:
      summary: Update single-hotel operational settings (including individual/group hold TTLs and free cancellation hours)
      operationId: updateHotelSettings
      tags:
        - Property
      security:
        - BearerAuth: []
      parameters:
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHotelSettingsRequest"
      responses:
        "200":
          description: Hotel settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/HotelSettings"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error (e.g. out-of-bounds hold TTL or free_cancel_hours)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vat-rates:
    get:
      summary: List VAT rates (active rate first)
      operationId: listVATRates
      tags:
        - Pricing
      security:
        - BearerAuth: []
      responses:
        "200":
          description: VAT rates list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/VATRate"
    post:
      summary: Create a VAT rate (activating atomically deactivates prior active rate)
      operationId: createVATRate
      tags:
        - Pricing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVATRateRequest"
      responses:
        "201":
          description: VAT rate created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VATRate"
        "409":
          description: Duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vat-rates/{id}:
    patch:
      summary: Update a VAT rate with optimistic locking (activating atomically deactivates prior active rate)
      operationId: updateVATRate
      tags:
        - Pricing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVATRateRequest"
      responses:
        "200":
          description: VAT rate updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VATRate"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/vat-rates/{id}/deactivate:
    post:
      summary: Deactivate a VAT rate without deleting historical snapshots
      operationId: deactivateVATRate
      tags:
        - Pricing
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: VAT rate deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/VATRate"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorField:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
        message:
          type: string

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          examples:
            - validation_failed
            - unauthenticated
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - version_conflict
            - rate_limited
            - service_unavailable
            - internal_error
        message:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ErrorField"
        requestId:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    PageInfo:
      type: object
      required:
        - limit
      properties:
        limit:
          type: integer
          minimum: 1
        cursor:
          type: string
          nullable: true
        nextCursor:
          type: string
          nullable: true

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    ReadyResponse:
      type: object
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - unavailable
        failed:
          type: array
          items:
            type: string

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - displayName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string
        phone:
          type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    UserSummary:
      type: object
      required:
        - id
        - kind
        - email
        - displayName
        - status
        - authorizationVersion
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - customer
            - staff
            - admin
        email:
          type: string
          format: email
        username:
          type: string
        displayName:
          type: string
        status:
          type: string
          enum:
            - pending_activation
            - active
            - disabled
        authorizationVersion:
          type: integer

    AuthResponse:
      type: object
      required:
        - accessToken
        - expiresIn
        - user
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: "#/components/schemas/UserSummary"

    HotelSettings:
      type: object
      required:
        - name
        - address
        - phone
        - email
        - timezone
        - currency
        - checkInTime
        - checkOutTime
        - individualHoldTtlMinutes
        - groupHoldTtlMinutes
        - freeCancelHours
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
        currency:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        individualHoldTtlMinutes:
          type: integer
          minimum: 1
          maximum: 120
        groupHoldTtlMinutes:
          type: integer
          minimum: 1
          maximum: 180
        freeCancelHours:
          type: integer
          minimum: 0
        logoMediaId:
          type: string
          format: uuid
          nullable: true
        logoUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer

    UpdateHotelSettingsRequest:
      type: object
      required:
        - name
        - address
        - phone
        - email
        - timezone
        - currency
        - checkInTime
        - checkOutTime
        - individualHoldTtlMinutes
        - groupHoldTtlMinutes
        - freeCancelHours
      properties:
        name:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        timezone:
          type: string
        currency:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        individualHoldTtlMinutes:
          type: integer
          minimum: 1
          maximum: 120
        groupHoldTtlMinutes:
          type: integer
          minimum: 1
          maximum: 180
        freeCancelHours:
          type: integer
          minimum: 0
        logoMediaId:
          type: string
          format: uuid
          nullable: true
        version:
          type: integer
          minimum: 1

    VATRate:
      type: object
      required:
        - id
        - code
        - name
        - rate
        - isActive
        - version
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        rate:
          type: string
          description: Exact decimal rate in [0, 1], e.g. "0.10"
        isActive:
          type: boolean
        createdAt:
          type: string
